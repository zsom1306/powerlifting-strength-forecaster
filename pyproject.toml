[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "powerlifting-strength-forecaster"
version = "0.1.0"
description = "Forecast next-meet changes in competitive powerlifting totals."
requires-python = ">=3.13"
dependencies = [
    "lightgbm==4.7.0",
    "numpy==2.5.3",
    "pandas==3.0.6",
    "scikit-learn==1.9.1",
]

[tool.setuptools.packages.find]
where = ["src"]
